<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuronPath - AI Learning Platform</title>
    <script>
      (function() {
        try {
          const directTheme = localStorage.getItem('neuronpath-theme');
          const stored = localStorage.getItem('neuronpath-storage');
          let isDark = directTheme === 'dark';
          if (!directTheme && stored) {
            const parsed = JSON.parse(stored);
            if (parsed && parsed.state && parsed.state.theme === 'dark') {
              isDark = true;
            }
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
